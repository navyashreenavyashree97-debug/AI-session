services:
  # ── Single Web Service: Flask serves both API + React SPA ──
  - type: web
    name: bloom-analytics-portal
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: >
      cd frontend &&
      npm install &&
      npm run build &&
      cd ../backend &&
      pip install -r requirements.txt
    startCommand: cd backend && gunicorn "app:create_app()" --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false          # you will paste this manually in Render dashboard
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"

  # ── Free PostgreSQL Database (Render managed) ──
databases:
  - name: bloom-db
    databaseName: bloom_analytics
    user: bloom_user
    plan: free
    region: singapore
